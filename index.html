    <script>
        (function() {
        let devtoolsOpen = false;
        const threshold = 160;

        function detectDevTools() {
            const widthThresholdExceeded = window.outerWidth - window.innerWidth > threshold;
            const heightThresholdExceeded = window.outerHeight - window.innerHeight > threshold;

            if (widthThresholdExceeded || heightThresholdExceeded) {
            if (!devtoolsOpen) {
                devtoolsOpen = true;
                redirectToYouTube();
            }
            }
        }

        function redirectToYouTube() {
            window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ&start_radio=1&pp=ygUHcmlrcm9sbKAHAQ%3D%3D";
        }

        setInterval(detectDevTools, 500);

        let lastTime = Date.now();
        setInterval(() => {
            const currentTime = Date.now();
            if (currentTime - lastTime > 1000) { 
            if (!devtoolsOpen) {
                devtoolsOpen = true;
                redirectToYouTube();
            }
            }
            lastTime = currentTime;
        }, 500);
        })();
    </script>
